# Use 24hr format for times.
use-24h-format: true

# Set the text of the TimeBar.
# {TIME} - The current world time, 7:20 am, etc.
# {TIME-WORD} - The time to display. Dawn, afternoon, etc.
# {DAYCOUNT} - How many total days in game have passed.
# {SEASON} - The current season.
# {DATE} - The current date.
# {DAY} - The day of week.
# {MONTH} - The day of week.
# {WORLDYEAR} - Current server year.
# {WORLDYEAR-ROMAN} - Current server year in roman numeral.
timebar-title: "{SEASON} | {DAY} {DATE} {WORLDYEAR-ROMAN}, {TIME} | {TIME-WORD}"
#timebar-title: "{DAY} {TIME} - {TIME-WORD} ({DATE})  - {SEASON} {DAYCOUNT}"

# Change the default formatting for dates.
# See: https://www.digitalocean.com/community/tutorials/java-simpledateformat-java-date-format
# Example: "dd/MM/yyyy"
date-format: "d. MMMM"

# Want to change the wording of the time of days?
times:
  dawn: "Úsvit"
  morning: "Ráno"
  noon: "Poledne"
  afternoon: "Odpoledne"
  sunset: "Soumrak"
  night: "Noc"
  midnight: "Půlnoc"
  
# Set the color per season for the TimeBar.
# The valid options are: blue, green, pink, purple, red, white, and yellow.
colors:
  SPRING: "PINK"
  SUMMER: "YELLOW"
  FALL: "RED"
  WINTER: "BLUE"

# Want to change the wording of the days?
days:
  sunday: "Neděle"
  monday: "Pondělí"
  tuesday: "Úterý"
  wednesday: "Středa"
  thursday: "Čtvrtek"
  friday: "Pátek"
  saturday: "Sobota"

# Set each "time of day" for each month.
# When the time hits one of these, it will turn that "time of day."
